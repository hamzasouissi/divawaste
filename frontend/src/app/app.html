@if (session.status() === 'authenticated') {
  <app-application-shell><router-outlet /></app-application-shell>
} @else if (session.status() === 'loading') {
  <main class="session-loading" role="status" aria-live="polite">
    <span class="loading-mark" aria-hidden="true">D</span>
    <span>{{ locale.t('loading') }}</span>
  </main>
} @else {
  <router-outlet />
}
