openapi: 3.0.3
info:
  title: 'DivaWaste Textile — API'
  description: 'REST API of DivaWaste Textile: waste traceability for textile manufacturers and their waste providers.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8010'
tags:
  -
    name: Identity
    description: 'Sign-in, account security, users, roles and invitations (M0).'
  -
    name: Tenancy
    description: 'Registration of a company, its profile, set-up wizard, and the platform review of accounts (M0).'
  -
    name: Billing
    description: 'Subscription, invoices and bank transfers of a client; plan activation and transfer review by the platform (M0-04, M7-04).'
  -
    name: Platform
    description: 'Back office of the SaaS operator: overview, plans and prices, invoices of every client, platform activity.'
  -
    name: Sites
    description: 'Sites, zones, stock and stock thresholds (M0, M3).'
  -
    name: Catalog
    description: 'Waste types of a company and the reference catalogue (M1).'
  -
    name: Waste
    description: 'Waste lots: creation, label, weighing, storage, split and grouping (M2).'
  -
    name: Sync
    description: 'Workshop application: device registration, reference data and replay of the operations recorded offline (M2-08).'
  -
    name: Providers
    description: 'Provider directory, partnerships, accepted waste and accreditations (M4).'
  -
    name: Pickups
    description: 'Pickups from request to closing, on the industrial and on the provider side (M5).'
  -
    name: Documents
    description: 'Register, documents, certificates, tracking slips and annual declarations (M6).'
  -
    name: Reporting
    description: 'Dashboard, production volumes and generated reports (M7).'
  -
    name: Notifications
    description: 'In-app notifications and notification preferences (M7-01).'
  -
    name: Audit
    description: 'Audit trail of a company (M7-02).'
  -
    name: Common
    description: 'Reference data shared by every screen.'
  -
    name: Production
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Three ways to authenticate, all through Laravel Sanctum:\n\n- **Web application** — cookie session: `GET /sanctum/csrf-cookie`, then `POST /api/v1/auth/login` with `\"mode\": \"session\"`. Every write then carries the `X-XSRF-TOKEN` header.\n- **Scripts and tests** — bearer token: `POST /api/v1/auth/login` with `\"mode\": \"token\"` returns `access_token` (12 hours). Send it as `Authorization: Bearer {ACCESS_TOKEN}`.\n- **Workshop devices** — device token: `POST /api/v1/mobile/devices` (signed in) returns a 30-day token that is only accepted by `POST /api/v1/sync/push`.\n\nSign-in enforces email verification, lockout after 5 failures, and the second factor (TOTP) when the account enabled it. A user who belongs to several companies chooses one: the session or token then answers for that company only."
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login auth'
      operationId: loginAuth
      description: 'Public authentication endpoints (strict limits: they accept credentials or send mail). Sign-in is limited per account and address, the others per address.'
      parameters: []
      responses:
        422:
          description: 'A parameter is missing or invalid; `errors` names each one.'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: 'Unprocessable Content'
                  status: 422
                  code: VALIDATION_FAILED
                  detail: 'The given data was invalid.'
                  errors:
                    email:
                      - 'The email field is invalid.'
                  request_id: 01J9ZX5E8Q4T7M2K6R3W0V1YNB
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: 'Unprocessable Content'
                  status:
                    type: integer
                    example: 422
                  code:
                    type: string
                    example: VALIDATION_FAILED
                  detail:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is invalid.'
                        items:
                          type: string
                  request_id:
                    type: string
                    example: 01J9ZX5E8Q4T7M2K6R3W0V1YNB
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                company:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                code:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                  example: ngzmiy
                  nullable: true
                recovery_code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: v
                  nullable: true
                mode:
                  type: string
                  description: ''
                  example: session
                  enum:
                    - token
                    - session
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/forgot-password:
